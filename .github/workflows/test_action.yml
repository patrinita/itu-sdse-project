name: Run Dagger Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dagger-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: dagger/go.mod
          cache-dependency-path: dagger/go.sum

      - name: Set up Dagger
        uses: dagger/dagger-for-github@v7
        with:
          version: "0.19.8"

      - name: Run Dagger Pipeline
        run: |
          cd dagger
          go mod download
          dagger run go run pipeline.go

      - name: Upload Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: cookie_eaters/artifacts/model.pkl

      - name: Run Model Inference Test Action
        uses: lasselundstenjensen/itu-sdse-project-model-validator@main
